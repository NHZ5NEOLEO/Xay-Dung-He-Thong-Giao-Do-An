{% extends "base.html" %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    .success-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif; /* Ép phông chữ xịn */
        background: #f8f9fe;
    }
    .success-card {
        background: white;
        padding: 50px;
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        max-width: 500px;
        width: 100%;
        text-align: center;
        animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .check-icon {
        width: 80px;
        height: 80px;
        background: #2dce89;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin: 0 auto 30px;
        box-shadow: 0 10px 20px rgba(45, 206, 137, 0.2);
    }
    .order-box {
        background: #f6f9fc;
        padding: 25px;
        border-radius: 20px;
        border: 2px dashed #ced4da;
        margin: 30px 0;
    }
    .btn-action {
        background: linear-gradient(135deg, #5e72e4 0%, #825ee4 100%);
        color: white;
        border: none;
        padding: 15px 35px;
        border-radius: 15px;
        font-weight: 700;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(94, 114, 228, 0.3);
    }
    .btn-action:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(94, 114, 228, 0.4); color: white; }
</style>

<div class="success-container">
    <div class="success-card">
        <div class="check-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 style="font-weight: 800; color: #32325d; margin-bottom: 10px;">Đã nhận vận đơn!</h2>
        <p style="color: #8898aa; font-size: 15px;">Đơn hàng đã được đẩy về Trung tâm điều phối của hệ thống Logistics.</p>
        
        <div class="order-box">
            <span style="display: block; font-size: 11px; color: #adb5bd; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px;">Mã vận đơn của bạn</span>
            <strong style="font-size: 32px; color: #5e72e4; letter-spacing: -1px;">#{{ don.ma_don }}</strong>
        </div>

        <a href="{% url 'core:partner_demo' %}" class="btn-action">
            <i class="fa-solid fa-rotate-left"></i> TIẾP TỤC GỬI ĐƠN MỚI
        </a>
    </div>
</div>
{% endblock %}
